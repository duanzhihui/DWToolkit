# excel_merge 配置文件
# Excel 文件合并工具

# ============ 输入文件配置 ============

# 扫描目录（相对路径基于本配置文件所在目录）
# 留空则不进行目录扫描
directory: "./data"

# 文件名正则表达式（匹配文件名，不含路径）
# 留空表示匹配目录下所有 .xlsx/.xlsm 文件
# 示例: 仅匹配以"销售"开头的文件 -> "^销售.*\\.xlsx$"
pattern: ""

# 是否递归扫描子目录
recursive: false

# 显式指定的文件列表（可选）
# 与目录扫描结果合并去重，相对路径基于配置文件所在目录
# files:
#   - "./extra/补充数据.xlsx"

# ============ 输出文件配置 ============

# 输出文件路径（相对路径基于配置文件所在目录）
output: "merged.xlsx"

# ============ Sheet 合并配置 ============
# 可配置多个 sheet，每个 sheet 独立配置:
#   - name:           源文件中的 sheet 名称（必填）
#   - output_name:    输出文件中的 sheet 名称（可选，默认同 name）
#   - header_rows:    表头行数，支持多级表头（默认 1）
#   - data_start_row: 数据起始行（1 基，可选）
#                     不配置时默认为 header_rows + 1
#                     当表头与数据之间存在空行/说明行时，可显式指定
# 说明: 表头取第一个包含该 sheet 的文件，仅合并数据行。
sheets:
  - name: "Sheet1"
    output_name: "Sheet1"
    header_rows: 1
    # data_start_row: 2

  # 多级表头示例（两行表头，数据从第 3 行开始）
  # - name: "明细"
  #   header_rows: 2
  #   data_start_row: 3
